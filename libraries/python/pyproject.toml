[project]
name = "alipatti"
version = "0.1.0"
description = "Personal Python helpers"
readme = "README.md"
authors = [{ name = "Alistair Pattison" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
plot = [
    "matplotlib>=3.10",
    "plotnine>=0.15",
]
cache = [
    "joblib>=1.6.0",
    "polars>=1.44.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
