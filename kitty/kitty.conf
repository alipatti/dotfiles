# docs: https://sw.kovidgoyal.net/kitty/conf/

# theme
font_family Cousine Nerd Font Mono
font_size 14
include Catppuccin-Frappe.conf

# tab bar
tab_bar_min_tabs 1
tab_bar_margin_width 5
tab_bar_margin_height 15 10
# tab_bar_edge top
tab_fade 0
tab_title_template "{fmt.bg._303446}{fmt.fg.color8}{fmt.fg.default}{fmt.bg.color8} {title} {fmt.bg._303446}{fmt.fg.color8}"
active_tab_title_template "{fmt.bg._303446}{fmt.fg._ca9ee6}{fmt.fg.tab}{fmt.bg._ca9ee6} {title} {fmt.bg._303446}{fmt.fg._ca9ee6}"
active_tab_font_style bold
tab_bar_background none

# window
shell_integration no-title
window_padding_width 0 15
remember_window_size no
initial_window_width 120c
initial_window_height 40c

# layouts: tall when terminals are visible, stack to zoom the focused window
enabled_layouts tall:bias=60,stack
map ctrl+; next_layout
map ctrl+. next_window
map ctrl+, previous_window

# make the active window obvious: dim the others
inactive_text_alpha 0.45

# new windows inherit the cwd of the focused window
map kitty_mod+enter new_window_with_cwd
map cmd+enter new_window_with_cwd

# remote control (nvim/plugin/kitty.lua drives kitty windows over this)
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# os-specific config
include kitty-${KITTY_OS}.conf
