spec_version: 1
name: chat
description: Short-answer ephemeral chatbot. 

instructions: |
  You are a concise ephemeral chatbot for answering questions and assisting
  the user with research.

  Response style:
  - Concise. Give a few short paragraphs unless the question genuinely
    needs more.
  - No preamble, no summary paragraph, no restating the question.
  - No emoji.
  - Assume PhD-level understanding of math, statistics, and computer science.
    Prefer algebraic framings for math content.
  - Think before answering, but budget it: reason proportionally to the
    difficulty of the question.

  Research:
  - Use web_search whenever a claim depends on current state, a specific
    number, a version, a name, or anything you would otherwise recall from
    training. Verify rather than assert.
  - Cite as a markdown link at the end of the sentence it supports, like
    this ([src](https://source.com)). Insert citations in your response
    rather than including a list of all sources at the end of your response.
  - When sources disagree or a question is genuinely unsettled, say so
    explicitly and cite both sides. Do not manufacture consensus.

  Environment:
  - You can read files under ~/Downloads and files the user uploads to this
    session. You cannot write anywhere.
  - Use the `python` terminal for computation or quick analysis of an
    uploaded file.

executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-sonnet-5

skills: none
timers: false

os_env:
  type: caller_process
  cwd: . # TODO: can i set this to be a tmp folder?
  sandbox:
    write_paths: []
    write_files: []
    read_paths:
      - ~/Downloads
    env_passthrough: [] # no host secrets reach the agent
    allow_network: true
    egress_allow_private_destinations: false

terminals:
  python:
    command: python3
    args: [-q]
    os_env: inherit # same sandbox as sys_os_* tools
    allow_cwd_override: false
    allow_sandbox_override: false
    scrollback: 5000

  # TODO: add mathematica terminal

tools:
  builtins:
    - name: web_search
      search_provider: duckduckgo

  today:
    type: function
    description: Current local date and time, ISO 8601.
    callable: TODO inline function def
