<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fridge Dashboard</title>
<link rel="stylesheet" href="style.css">
<body class="bg-canvas p-4 font-sans text-sm text-ink antialiased">
<header class="sticky top-4 z-10 mb-4 flex flex-wrap justify-between gap-4">
  <div class="panel flex items-center gap-3 py-1 pr-1 pl-3.5">
    <strong>fridge</strong>
    <div id="ranges" class="flex rounded-lg bg-fill p-0.5" role="radiogroup" aria-label="Range"></div>
    <span class="text-muted">smooth</span>
    <div id="smoothing" class="flex rounded-lg bg-fill p-0.5" role="radiogroup" aria-label="Smoothing"></div>
  </div>
  <ul id="legend" class="panel flex flex-wrap items-center gap-x-4 gap-y-1 px-3.5 py-2 text-muted"></ul>
</header>
<main id="charts" class="grid grid-cols-[repeat(auto-fill,minmax(min(600px,100%),1fr))] gap-4"></main>
<script type="module">
import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";

// one colour per unit shown
const style = getComputedStyle(document.documentElement);
const PALETTE = [1, 2, 3, 4, 5, 6].map((i) => style.getPropertyValue(`--color-palette-${i}`).trim());
const RANGES = { "1h": 1, "6h": 6, "24h": 24, "7d": 168, "30d": 720 };
// trailing mean, in minutes
const SMOOTHING = { off: 0, "5m": 5, "30m": 30, "2h": 120 };
const bytes = (x) => {
  const i = Math.max(0, Math.min(4, Math.floor(Math.log10(Math.abs(x)) / 3)));
  return `${+(x / 1000 ** i).toPrecision(3)} ${["B", "KB", "MB", "GB", "TB"][i]}`;
};
const METRICS = {
  "CPU (cores)": ["CPUUsageNSec", (x) => +(x / 1e9).toPrecision(2)],
  "Memory": ["MemoryWorkingSet", bytes],
  "Disk read (/s)": ["IOReadBytes", bytes],
  "Disk write (/s)": ["IOWriteBytes", bytes],
  "Network in (/s)": ["IPIngressBytes", bytes],
  "Network out (/s)": ["IPEgressBytes", bytes],
  "GPU memory": ["GPUMemoryUsed", bytes],
};

let hours = 6;
let smooth = 0;
let rows = [];

const cards = Object.entries(METRICS).map(([title, [key, format]]) => {
  const card = document.createElement("section");
  card.className = "panel p-3.5";
  // the tooltip is html over the plot, styled like transit-maps' station tooltip
  card.innerHTML = `<h2 class="mb-2 font-semibold">${title}</h2>
    <div class="relative">
      <div></div>
      <div class="pointer-events-none absolute z-10 hidden w-max rounded-lg bg-card/95 px-2.5 py-1.5 shadow-(--shadow-menu) backdrop-blur-xl"></div>
    </div>`;
  charts.append(card);
  const [plot, tip] = card.lastElementChild.children;
  return { key, format, plot, tip };
});

/** the units shown in every chart: each metric's top unit, then each's second, ... */
function topUnits() {
  const rankings = Object.values(METRICS).map(([key]) => {
    const totals = new Map();
    for (const d of rows) totals.set(d.name, (totals.get(d.name) ?? 0) + (d[key] ?? 0));
    return [...totals].filter(([, total]) => total > 0).sort((a, b) => b[1] - a[1]).map(([name]) => name);
  });
  const units = new Set();
  for (let rank = 0; units.size < PALETTE.length && rankings.some((r) => rank < r.length); rank++) {
    for (const r of rankings) if (units.size < PALETTE.length && r[rank]) units.add(r[rank]);
  }
  return [...units];
}

function draw() {
  const top = topUnits();
  const shown = rows.filter((d) => top.includes(d.name));

  legend.replaceChildren(...top.map((name, i) => {
    const item = document.createElement("li");
    item.className = "flex items-center gap-2";
    const swatch = document.createElement("span");
    swatch.className = "h-1.5 w-5 rounded-full";
    swatch.style.background = PALETTE[i];
    item.append(swatch, name);
    return item;
  }));

  for (const { key, format, plot, tip } of cards) {
    // like theme_classic: axis lines, no grid
    const svg = Plot.plot({
      width: plot.clientWidth,
      height: 200,
      marginLeft: 56,
      style: { fontFamily: "inherit", fontSize: "11px" },
      color: { domain: top, range: PALETTE },
      // the browser's time zone (plot defaults to utc)
      x: { type: "time", label: null },
      y: { label: null, zero: true, ticks: 5, tickFormat: format },
      marks: [
        Plot.frame({ anchor: "left" }),
        Plot.frame({ anchor: "bottom" }),
        Plot.lineY(shown, { x: "ts", y: key, stroke: "name", strokeWidth: 1.5 }),
        // the point nearest the pointer, which svg.value holds
        Plot.dot(shown, Plot.pointerX({ x: "ts", y: key, fill: "name", r: 4, stroke: "var(--color-card)" })),
      ],
    });
    svg.addEventListener("input", () => showTip(tip, svg, svg.value, key, format, top));
    plot.replaceChildren(svg);
    tip.classList.add("hidden");
  }
}

function showTip(tip, svg, d, key, format, top) {
  if (!d) return tip.classList.add("hidden");

  const swatch = document.createElement("span");
  swatch.className = "h-1.5 w-4 rounded-full";
  swatch.style.background = PALETTE[top.indexOf(d.name)];
  const name = document.createElement("div");
  name.className = "flex items-center gap-2 font-semibold";
  name.append(swatch, d.name);
  const value = document.createElement("div");
  value.textContent = format(d[key]);
  const time = document.createElement("div");
  time.className = "text-muted";
  time.textContent = d.ts.toLocaleString();
  tip.replaceChildren(name, value, time);

  // beside the point, on whichever side has more room
  const x = svg.scale("x").apply(d.ts);
  const y = svg.scale("y").apply(d[key]);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
  tip.style.transform = `translate(${x > svg.clientWidth / 2 ? "calc(-100% - 12px)" : "12px"}, -50%)`;
  tip.classList.remove("hidden");
}

async function load() {
  const response = await fetch(`api/usage?hours=${hours}&smooth=${smooth}`);
  rows = (await response.json()).map((d) => ({ ...d, ts: new Date(d.ts) }));
  draw();
}

/** fill a segmented control with `options` (label -> value), calling `choose` on a click */
function segmented(control, options, chosen, choose) {
  control.replaceChildren(...Object.entries(options).map(([label, value]) => {
    const button = document.createElement("button");
    button.className = "cursor-pointer rounded-md px-2.5 py-1 text-muted hover:text-ink aria-checked:segment-on";
    button.textContent = label;
    button.role = "radio";
    button.ariaChecked = value === chosen;
    button.onclick = () => {
      for (const b of control.children) b.ariaChecked = b === button;
      choose(value);
    };
    return button;
  }));
}

segmented(ranges, RANGES, hours, (h) => { hours = h; load(); });
segmented(smoothing, SMOOTHING, smooth, (m) => { smooth = m; load(); });

let resizing;
addEventListener("resize", () => {
  clearTimeout(resizing);
  resizing = setTimeout(draw, 100);
});
setInterval(load, 60_000);
load();
</script>
