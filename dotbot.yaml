# see: https://github.com/anishathalye/dotbot#directives

- shell:
    - description: Install Homebrew
      command: command -v brew || /bin/bash -c "$(curl -fsSL
        https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

- brew:
     # python
    - uv

    # git
    - git
    - gh # github

    # command line tools
    - zoxide # cd
    - starship # prompt

# gui apps
- cask:
    - kitty # https://search.nixos.org/packages?show=kitty
    - font-cousine-nerd-font # font for kitty

- defaults:
    link:
      relink: true
      create: true
    shell:
      quiet: true
    brew:
      stdout: false
      stderr: false
    cask:
      stdout: false
      stderr: false

- link:
    ~/.config/kitty: kitty
    ~/.config/starship.toml: starship/starship.toml
    ~/.gitignore: git/ignore
    ~/.gitconfig: git/config

- shell:
    - touch ~/.hushlogin # hide "last login message"

# remove broken symlinks
- clean:
    - "~"
    - ~/.config/
    - ~/.local/bin
